name: OIDC estate readiness

on:
  schedule:
    - cron: '17 2 * * *' # refresh current-main OIDC evidence daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-estate:
    name: Verify current-main OIDC evidence across the estate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Verify latest readiness run for each exact default-branch commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const owner = "Jonathan-Harris1975";
          const repositories = [
            { name: "AIMS", id: 1106415939 },
            { name: "AIMS-UI", id: 1323481583 },
            { name: "HIVE", id: 1262518964 },
            { name: "HIVE-UI", id: 1268367441 },
            { name: "IRS", id: 1206529096 },
            { name: "RAMS", id: 1231842308 },
            { name: "MAST", id: 1230128339 },
            { name: "jonathan-harris-website", id: 1170187039 },
          ];
          const api = "https://api.github.com";
          const headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "MAST-OIDC-estate-readiness",
          };
          async function getJson(path) {
            const response = await fetch(api + path, {
              headers,
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}`);
            }
            return response.json();
          }

          const results = [];
          for (const repository of repositories) {
            const root = `/repos/${owner}/${repository.name}`;
            const metadata = await getJson(root);
            if (metadata.id !== repository.id || metadata.default_branch !== "main") {
              throw new Error(`${repository.name}: repository identity/default branch changed`);
            }
            const branch = await getJson(`${root}/branches/main`);
            const sha = branch.commit?.sha;
            if (!/^[0-9a-f]{40}$/.test(sha || "")) {
              throw new Error(`${repository.name}: current main SHA is unavailable`);
            }
            const workflowFile = await getJson(
              `${root}/contents/.github/workflows/oidc-readiness.yml?ref=${sha}`,
            );
            if (workflowFile.type !== "file" || workflowFile.encoding !== "base64" || !workflowFile.content) {
              throw new Error(`${repository.name}: OIDC readiness workflow source is unavailable at current main ${sha}`);
            }
            const workflowSource = Buffer.from(workflowFile.content.replace(/\n/g, ""), "base64").toString("utf8");
            const workflowBindingPresent =
              /EXPECTED_WORKFLOW_REF:\s*\$\{\{\s*github\.repository\s*\}\}\/\.github\/workflows\/oidc-readiness\.yml@refs\/heads\/main/.test(workflowSource) &&
              /^\s*workflow_ref:\s*process\.env\.EXPECTED_WORKFLOW_REF\s*,?\s*$/m.test(workflowSource) &&
              /claims\[name\]\s*!==\s*value/.test(workflowSource);
            if (!workflowBindingPresent) {
              throw new Error(`${repository.name}: current-main OIDC readiness code does not enforce the canonical exact workflow_ref claim`);
            }
            const readinessDeadline = Date.now() + 60_000;
            let latest;
            while (Date.now() < readinessDeadline) {
              const runs = await getJson(
                `${root}/actions/workflows/oidc-readiness.yml/runs?branch=main&head_sha=${sha}&per_page=10`,
              );
              latest = runs.workflow_runs?.find(
                run => run.head_sha === sha && run.status === "completed",
              );
              if (latest) break;
              await new Promise(resolve => setTimeout(resolve, 5_000));
            }
            const currentBranch = await getJson(`${root}/branches/main`);
            const currentSha = currentBranch.commit?.sha;
            if (currentSha !== sha) {
              throw new Error(
                `${repository.name}: main advanced from ${sha} to ${currentSha || "unknown"} while readiness was being collected; restart estate verification`,
              );
            }
            if (!latest) {
              throw new Error(`${repository.name}: no OIDC readiness run exists for current main ${sha} after bounded wait`);
            }
            const completedAt = Date.parse(latest.updated_at || latest.created_at || "");
            const ageMs = Date.now() - completedAt;
            const maxEvidenceAgeMs = 7 * 24 * 60 * 60 * 1000;
            if (latest.head_sha !== sha || latest.status !== "completed" ||
                latest.conclusion !== "success" ||
                !["push", "schedule", "workflow_dispatch"].includes(latest.event) ||
                !Number.isFinite(completedAt) || ageMs < -60_000 || ageMs > maxEvidenceAgeMs) {
              throw new Error(
                `${repository.name}: latest readiness run ${latest.id} for current main ${sha} is ${latest.status}/${latest.conclusion}; evidence age is ${Number.isFinite(ageMs) ? Math.round(ageMs / 60000) + "m" : "unknown"}`,
              );
            }
            results.push({
              repository: repository.name,
              repository_id: repository.id,
              default_branch: "main",
              head_sha: sha,
              workflow_ref: `${owner}/${repository.name}/.github/workflows/oidc-readiness.yml@refs/heads/main`,
              workflow_binding_verified: true,
              run_id: latest.id,
              run_event: latest.event,
              run_url: latest.html_url,
              completed_at: latest.updated_at,
              conclusion: latest.conclusion,
            });
          }
          writeFileSync("oidc-estate-readiness.json", JSON.stringify({
            schema_version: 1,
            verified_at: new Date().toISOString(),
            verification_scope: "latest successful readiness run on each repository's exact current main SHA and static presence of the canonical workflow_ref guard; no cloud provider trust is verified",
            repositories: results,
          }, null, 2) + "\n");
          NODE

      - name: Retain estate readiness evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidc-estate-readiness-${{ github.sha }}
          path: oidc-estate-readiness.json
          if-no-files-found: error
          retention-days: 90

  notify-failure:
    name: Notify central operations when estate OIDC evidence fails
    needs: [verify-estate]
    if: ${{ always() && needs.verify-estate.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require operational alert credential
        env:
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN || secrets.OPS_EVENT_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OPS_ALERT_WEBHOOK_TOKEN" ]; then
            echo "::error::OIDC estate verification failed and no central operations webhook credential is configured."
            exit 1
          fi

      - name: Route OIDC estate failure to central operations
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ vars.OPS_ALERT_WEBHOOK_URL || secrets.OPS_ALERT_WEBHOOK_URL || 'https://liable-loreen-jonathanharris-57884580.koyeb.app/v1/ops/events' }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN || secrets.OPS_EVENT_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/ops_notify.py \
            --service MAST \
            --event-type oidc_estate_readiness_failed \
            --title "Estate OIDC readiness verification failed" \
            --summary "At least one repository lacks current successful OIDC evidence or the canonical exact workflow identity guard on its main SHA. Inspect the linked MAST run for the repository, SHA and workflow run ID." \
            --severity critical \
            --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}" \
            --release-id "${{ github.sha }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
