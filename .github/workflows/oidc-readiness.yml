name: OIDC readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-oidc:
    name: GitHub OIDC claim verification
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Request and verify GitHub OIDC token
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: refs/heads/main
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          audience = f"https://github.com/{os.environ['EXPECTED_OWNER']}"
          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_url += ("&" if "?" in request_url else "?") + "audience=" + urllib.parse.quote(audience, safe="")
          request = urllib.request.Request(request_url, headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)["value"]
          parts = token.split(".")
          if len(parts) != 3:
              raise RuntimeError("GitHub OIDC endpoint returned a malformed JWT")
          payload = parts[1] + "=" * (-len(parts[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected = {"iss": "https://token.actions.githubusercontent.com", "aud": audience, "repository": os.environ["EXPECTED_REPOSITORY"], "ref": os.environ["EXPECTED_REF"]}
          for key, value in expected.items():
              if claims.get(key) != value:
                  raise RuntimeError(f"OIDC claim {key!r} did not match the expected value")
          safe_claims = {k: claims.get(k) for k in ("iss","aud","repository","repository_id","repository_owner","ref","sha","workflow","job_workflow_ref","event_name","run_id","run_attempt")}
          safe_claims["verified"] = True
          with open("oidc-readiness.json", "w", encoding="utf-8") as handle:
              json.dump(safe_claims, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Verify all governed repositories are online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          owner = "Jonathan-Harris1975"
          repos = [
              "AIMS",
              "AIMS-UI",
              "HIVE",
              "HIVE-UI",
              "IRS",
              "MAST",
              "RAMS",
              "jonathan-harris-website",
          ]
          results = []
          for repo in repos:
              repo_payload = json.loads(subprocess.check_output([
                  "gh", "api", f"/repos/{owner}/{repo}"
              ], text=True))
              default_branch = repo_payload.get("default_branch")
              if not default_branch:
                  raise RuntimeError(f"{repo} has no default branch")
              branch_payload = json.loads(subprocess.check_output([
                  "gh", "api", f"/repos/{owner}/{repo}/branches/{default_branch}"
              ], text=True))
              sha = ((branch_payload.get("commit") or {}).get("sha") or "").strip()
              if len(sha) != 40:
                  raise RuntimeError(f"{repo} default branch did not resolve to a full commit SHA")
              results.append({
                  "repository": f"{owner}/{repo}",
                  "default_branch": default_branch,
                  "sha": sha,
                  "online": True,
              })

          with open("oidc-estate-online.json", "w", encoding="utf-8") as handle:
              json.dump({
                  "checker": f"{owner}/MAST",
                  "count": len(results),
                  "all_online": all(item["online"] for item in results),
                  "repositories": results,
              }, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Retain estate online evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-estate-online-${{ github.sha }}
          path: oidc-estate-online.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain sanitised OIDC evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-readiness-${{ github.sha }}
          path: oidc-readiness.json
          if-no-files-found: error
          retention-days: 90
