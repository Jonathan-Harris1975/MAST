name: OIDC readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-oidc:
    name: GitHub OIDC claim verification
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Check out governed repository catalogue
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Request and verify GitHub OIDC token
        shell: bash
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REF: refs/heads/main
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createPublicKey, verify } from "node:crypto";
          import { writeFileSync } from "node:fs";

          const issuer = "https://token.actions.githubusercontent.com";
          const audience = `https://github.com/${process.env.EXPECTED_OWNER}`;
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set("audience", audience);
          const request = await fetch(endpoint, {
            headers: { Authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            signal: AbortSignal.timeout(20000),
          });
          if (!request.ok) throw new Error("OIDC token request failed");
          const { value: token } = await request.json();
          const parts = token?.split(".");
          if (parts?.length !== 3) throw new Error("Malformed OIDC JWT");
          const header = JSON.parse(Buffer.from(parts[0], "base64url").toString("utf8"));
          const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
          if (header.alg !== "RS256" || !header.kid || header.typ && header.typ !== "JWT") {
            throw new Error("Unsupported OIDC JWT signing header");
          }
          const discoveryResponse = await fetch(`${issuer}/.well-known/openid-configuration`, {
            signal: AbortSignal.timeout(20000),
          });
          if (!discoveryResponse.ok) throw new Error("OIDC discovery failed");
          const discovery = await discoveryResponse.json();
          if (discovery.issuer !== issuer || !discovery.jwks_uri?.startsWith(`${issuer}/`)) {
            throw new Error("Unexpected OIDC discovery issuer or JWKS endpoint");
          }
          const keysResponse = await fetch(discovery.jwks_uri, { signal: AbortSignal.timeout(20000) });
          if (!keysResponse.ok) throw new Error("OIDC JWKS retrieval failed");
          const { keys } = await keysResponse.json();
          const matches = keys.filter(k => k.kid === header.kid && k.kty === "RSA" &&
            (!k.use || k.use === "sig") && (!k.alg || k.alg === "RS256"));
          if (matches.length !== 1) throw new Error("OIDC signing key not uniquely identified");
          const key = createPublicKey({ key: matches[0], format: "jwk" });
          const valid = verify("RSA-SHA256", Buffer.from(`${parts[0]}.${parts[1]}`),
            key, Buffer.from(parts[2], "base64url"));
          if (!valid) throw new Error("OIDC JWT signature invalid");
          const now = Math.floor(Date.now() / 1000);
          if (!Number.isInteger(claims.exp) || claims.exp <= now ||
              !Number.isInteger(claims.iat) || claims.iat > now + 60 ||
              (claims.nbf !== undefined && (!Number.isInteger(claims.nbf) || claims.nbf > now + 60))) {
            throw new Error("OIDC JWT lifetime invalid");
          }
          const expected = { iss: issuer, aud: audience,
            repository: process.env.EXPECTED_REPOSITORY, ref: process.env.EXPECTED_REF,
            sha: process.env.GITHUB_SHA };
          for (const [name, value] of Object.entries(expected)) {
            if (claims[name] !== value) throw new Error(`OIDC claim ${name} mismatch`);
          }
          const fields = ["iss", "aud", "repository", "repository_id", "repository_owner",
            "ref", "sha", "workflow", "job_workflow_ref", "event_name", "run_id", "run_attempt"];
          const safe = Object.fromEntries(fields.map(field => [field, claims[field] ?? null]));
          safe.claims_checked = true;
          safe.signature_verified = true;
          safe.verification_scope = "RS256 signature verified against issuer JWKS; lifetime and identity checked";
          writeFileSync("oidc-readiness.json", JSON.stringify(safe, null, 2) + "\\n");
          NODE

      - name: Verify all governed repositories are online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          import { HIVE_GOVERNED_REPOSITORIES } from "./src/jobs.js";

          const owner = "Jonathan-Harris1975";
          const repositoryName = (name) => name === "Website" ? "jonathan-harris-website" : name;
          const ghJson = (path) => JSON.parse(execFileSync("gh", ["api", path], {
            encoding: "utf8",
            timeout: 30_000,
            maxBuffer: 1_000_000,
          }));

          const results = HIVE_GOVERNED_REPOSITORIES.map((governedName) => {
            const repo = repositoryName(governedName);
            const repoPayload = ghJson(`/repos/${owner}/${repo}`);
            const defaultBranch = String(repoPayload.default_branch || "").trim();
            if (!defaultBranch) throw new Error(`${repo} has no default branch`);
            const branchPayload = ghJson(`/repos/${owner}/${repo}/branches/${encodeURIComponent(defaultBranch)}`);
            const sha = String(branchPayload?.commit?.sha || "").trim();
            const online = /^[0-9a-f]{40}$/i.test(sha);
            if (!online) throw new Error(`${repo} default branch did not resolve to a full commit SHA`);
            return {
              repository: `${owner}/${repo}`,
              default_branch: defaultBranch,
              sha,
              online,
            };
          });

          writeFileSync("oidc-estate-online.json", `${JSON.stringify({
            checker: `${owner}/MAST`,
            count: results.length,
            all_online: results.every((item) => item.online),
            repositories: results,
          }, null, 2)}\n`, "utf8");
          NODE

      - name: Retain estate online evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-estate-online-${{ github.sha }}
          path: oidc-estate-online.json
          if-no-files-found: error
          retention-days: 90

      - name: Retain sanitised OIDC evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-readiness-${{ github.sha }}
          path: oidc-readiness.json
          if-no-files-found: error
          retention-days: 90
