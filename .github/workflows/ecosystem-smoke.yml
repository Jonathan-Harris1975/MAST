name: Ecosystem smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production ecosystem smoke
        run: npm run ecosystem:smoke
        env:
          MAST_BASE_URL: ${{ vars.MAST_BASE_URL || secrets.MAST_BASE_URL }}
          AIMS_BASE_URL: ${{ vars.AIMS_BASE_URL || 'https://app.jonathan-harris.online' }}
          RAMS_BASE_URL: ${{ vars.RAMS_BASE_URL || 'https://mod.jonathan-harris.online' }}
          HIVE_BASE_URL: ${{ vars.HIVE_BASE_URL || 'https://hive.jonathan-harris.online' }}
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL || 'https://jonathan-harris.online' }}
          HIVE_UI_BASE_URL: ${{ vars.HIVE_UI_BASE_URL }}
          AIMS_UI_BASE_URL: ${{ vars.AIMS_UI_BASE_URL }}
          CRON_ADMIN_TOKEN: ${{ secrets.CRON_ADMIN_TOKEN }}
          RMS_API_KEY: ${{ secrets.RMS_API_KEY }}
          HIVE_ADMIN_BEARER_TOKEN: ${{ secrets.HIVE_ADMIN_BEARER_TOKEN }}
          HIVE_UI_ACCESS_KEY: ${{ secrets.HIVE_UI_ACCESS_KEY }}
