name: Ecosystem smoke

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository that requested this ecosystem smoke
        required: false
        type: string
      source_sha:
        description: Exact source commit SHA that must be recorded with the smoke
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Install verified Koyeb CLI
        run: bash scripts/install_koyeb_cli.sh
      - name: Production MAST Worker/API smoke
        run: |
          set -o pipefail
          bash scripts/run_koyeb_worker_smoke.sh | tee worker-api-smoke.log
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.source_sha || github.sha }}
          ECOSYSTEM_SMOKE_RETRY_ATTEMPTS: "24"
          ECOSYSTEM_SMOKE_RETRY_DELAY_MS: "5000"
      - name: Record Worker/API-smoke attestation
        if: success()
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository || github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          printf '{"orchestrator_repository":"%s","orchestrator_sha":"%s","source_repository":"%s","source_sha":"%s","workflow_run":"%s","status":"worker-api-smoke-green"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$SOURCE_REPOSITORY" "$SOURCE_SHA" "$GITHUB_RUN_ID" > worker-api-smoke-attestation.json
      - name: Retain Worker/API-smoke launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-api-smoke-${{ inputs.source_sha || github.sha }}
          path: |
            worker-api-smoke.log
            worker-api-smoke-attestation.json
          if-no-files-found: warn
          retention-days: 90
