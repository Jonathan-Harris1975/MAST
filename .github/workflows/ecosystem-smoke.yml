name: Ecosystem smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: HIVE → AIMS communications smoke
        run: npm run ecosystem:smoke
        env:
          HIVE_UI_BASE_URL: ${{ vars.HIVE_UI_BASE_URL }}
          AIMS_UI_BASE_URL: ${{ vars.AIMS_UI_BASE_URL }}
          HIVE_UI_ACCESS_KEY: ${{ secrets.HIVE_UI_ACCESS_KEY }}
