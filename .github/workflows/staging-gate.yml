name: Ecosystem staging gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-staging-gate
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run MAST → AIMS/RAMS/HIVE → UI staging exercise
        env:
          MAST_BASE_URL: ${{ vars.MAST_BASE_URL || secrets.MAST_BASE_URL }}
          CRON_ADMIN_TOKEN: ${{ secrets.CRON_ADMIN_TOKEN }}
          HIVE_UI_BASE_URL: ${{ vars.HIVE_UI_BASE_URL || secrets.HIVE_UI_BASE_URL }}
          HIVE_UI_ACCESS_KEY: ${{ secrets.HIVE_UI_ACCESS_KEY }}
          AIMS_UI_BASE_URL: ${{ vars.AIMS_UI_BASE_URL || secrets.AIMS_UI_BASE_URL }}
        run: npm run staging:gate
