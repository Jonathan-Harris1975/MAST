name: Ecosystem staging gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-staging-gate
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.8"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify governed MAST job registry
        run: npm run staging:gate -- --registry-only
      - name: Install verified Koyeb CLI
        run: bash scripts/install_koyeb_cli.sh
      - name: Run deployed Worker heartbeat and API staging exercise
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: bash scripts/run_koyeb_worker_smoke.sh
