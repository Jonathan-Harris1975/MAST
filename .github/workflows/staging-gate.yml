name: Ecosystem staging gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-staging-gate
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install pinned npm version
        run: npm install --global "npm@$(node -p 'require("./package.json").engines.npm')" --ignore-scripts --no-audit --no-fund
      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v$(node -p 'require("./package.json").engines.node')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify governed MAST job registry
        run: npm run staging:gate -- --registry-only
      - name: Install verified Koyeb CLI
        run: bash scripts/install_koyeb_cli.sh
      - name: Run deployed Worker heartbeat and API staging exercise
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: bash scripts/run_koyeb_worker_smoke.sh
