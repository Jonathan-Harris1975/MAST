name: MAST CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Reject committed literal secrets
        run: python3 scripts/secret_scan.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Enforce health endpoint performance SLO
        run: npm run perf:gate
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t mast:ci .
      - name: Verify Node runtime and boot API inside production image
        run: |
          docker run --rm mast:ci node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 22) process.exit(1);"
          docker run -d --name mast-ci-api -p 18000:8000 \
            -e APP_ENV=development \
            -e MAST_STATE_BACKEND=local \
            -e ALLOW_EPHEMERAL_STATE=true \
            -e STATE_FILE=/tmp/mast-ci-state.json \
            -e SCHEDULER_ENABLED=false \
            -e CRON_ADMIN_TOKEN=ci-admin-token \
            mast:ci
          trap 'docker logs mast-ci-api || true; docker rm -f mast-ci-api || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18000/health >/tmp/mast-health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health | grep -q '"status":"healthy"'

  notify_failure:
    name: Notify central operations on CI failure
    needs: [verify, docker]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ vars.OPS_ALERT_WEBHOOK_URL || secrets.OPS_ALERT_WEBHOOK_URL || 'https://liable-loreen-jonathanharris-57884580.koyeb.app/v1/ops/events' }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN || secrets.OPS_EVENT_INGEST_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service MAST
          --event-type ci_failed
          --title "MAST GitHub Actions failed"
          --summary "The governed CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [verify, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all release checks to be green
        env:
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
        run: |
          test "$RESULT_VERIFY" = "success"
          test "$RESULT_DOCKER" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

