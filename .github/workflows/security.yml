name: Security and repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mast-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Repository secret policy scan
        run: python3 scripts/secret_scan.py
      - name: Install pinned Gitleaks and actionlint
        env:
          GOBIN: ${{ runner.temp }}/ci-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Verify Gitleaks exact-fingerprint ignore contract
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/ci-bin/gitleaks
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          cd "$fixture"
          git init -q
          git config user.name 'MAST CI'
          git config user.email 'ci@example.invalid'

          canary_one="ghp_$(printf 'mast-gitleaks-ignore-contract-one' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_one" > ignored.txt
          git add ignored.txt
          git commit -qm 'synthetic ignored finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --report-format json --report-path first.json --exit-code 42
          first_status=$?
          set -e
          test "$first_status" -eq 42 || {
            echo "::error::Gitleaks canary was not detected before allowlisting (exit $first_status)."
            exit 1
          }

          fingerprint="$(jq -er '.[0].Fingerprint' first.json)"
          printf '%s\n' "$fingerprint" > .gitleaksignore

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          ignored_status=$?
          set -e
          test "$ignored_status" -eq 0 || {
            echo "::error::Exact Gitleaks fingerprint was not suppressed (exit $ignored_status)."
            exit 1
          }

          canary_two="ghp_$(printf 'mast-gitleaks-ignore-contract-two' | sha256sum | cut -c1-36)"
          printf 'token = "%s"\n' "$canary_two" > unlisted.txt
          git add .gitleaksignore unlisted.txt
          git commit -qm 'synthetic unlisted finding'

          set +e
          "$GITLEAKS_BIN" git . --redact=100 --no-banner --exit-code 42
          unlisted_status=$?
          set -e
          test "$unlisted_status" -eq 42 || {
            echo "::error::Unlisted synthetic finding did not fail Gitleaks (exit $unlisted_status)."
            exit 1
          }

      - name: Gitleaks history scan
        id: gitleaks
        continue-on-error: true
        run: |
          "${{ runner.temp }}/ci-bin/gitleaks" git . --redact=100 --no-banner \
            --report-format json --report-path "${{ runner.temp }}/gitleaks-raw.json"

      - name: Publish safe Gitleaks finding metadata
        if: always()
        env:
          RAW_REPORT: ${{ runner.temp }}/gitleaks-raw.json
          SAFE_REPORT: ${{ runner.temp }}/gitleaks-findings.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$RAW_REPORT" ]; then
            jq '[.[] | {
              rule_id: .RuleID,
              file: .File,
              start_line: .StartLine,
              commit: .Commit,
              fingerprint: .Fingerprint
            }]' "$RAW_REPORT" > "$SAFE_REPORT"
          else
            printf '[]\n' > "$SAFE_REPORT"
          fi
          count="$(jq 'length' "$SAFE_REPORT")"
          echo "### Gitleaks findings: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            jq -r '.[] | "- (.rule_id) — (.file):(.start_line) — commit (.commit) — fingerprint (.fingerprint)"' "$SAFE_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain safe Gitleaks findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-findings.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Gitleaks result
        if: always()
        env:
          GITLEAKS_OUTCOME: ${{ steps.gitleaks.outcome }}
        run: test "$GITLEAKS_OUTCOME" = success

      - name: Validate GitHub Actions workflows
        run: |
          "${{ runner.temp }}/ci-bin/actionlint" -color
      - name: Validate Kilo machine repair contract wiring
        env:
          GH_TOKEN: ci-placeholder
          DEFAULT_BRANCH: main
          GITHUB_EVENT_NAME: workflow_run
        run: |
          PYTHONPATH=.github/scripts python3 - <<'PY'
          from pr_repair_router import machine_contract
          contract = machine_contract()
          assert "Do not ask for human confirmation" in contract
          assert "Do not merge" in contract
          PY
      - name: Audit GitHub Actions security posture with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: medium
          min-confidence: medium
          online-audits: false
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
      - name: Set up Node.js for Renovate validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Validate Renovate configuration
        run: npx --yes --ignore-scripts --package=renovate@44.133.0 renovate-config-validator --strict renovate.json
      - name: Trivy filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
