name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: >-
      github.actor != 'autofix-ci[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'mergify/merge-queue/') &&
      !startsWith(github.head_ref, 'autonomy/repair-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply repository-supported Python fixes if configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -qi '\[tool.ruff' pyproject.toml && python -m ruff --version >/dev/null 2>&1; then
            python -m ruff check . --fix-only --select E4,E7,E9,F
          else
            echo "No repository-pinned safe formatter/fixer is configured; leaving source unchanged."
          fi
      - name: Submit patch only when a safe fixer changed files
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          fail-fast: false
