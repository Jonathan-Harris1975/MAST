name: Weekend CI phase launcher
'on':
  schedule:
  - cron: 30 22 * * 5
  - cron: 30 21 * * 5
  - cron: 0 21 * * 0
  - cron: 0 20 * * 0
  workflow_dispatch:
    inputs:
      phase:
        description: Phase to dispatch
        required: true
        default: ci
        type: choice
        options:
        - ci
        - council
permissions:
  actions: write
  contents: read
concurrency:
  group: weekend-phase-launcher-${{ github.repository }}
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Resolve Europe/London phase slot
      id: slot
      env:
        EVENT_NAME: ${{ github.event_name }}
        MANUAL_PHASE: ${{ inputs.phase || '' }}
        SCHEDULE: ${{ github.event.schedule || '' }}
        CI_START: Fri 22:30
        DAST_START: N/A
        COUNCIL_START: Sun 21:00
        CI_WORKFLOW: ci.yml
      shell: bash
      run: python3 .github/scripts/weekend_slot.py
    - name: Dispatch phase workflow
      if: steps.slot.outputs.run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ steps.slot.outputs.workflow }}
        PHASE: ${{ steps.slot.outputs.phase }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        if [ "$PHASE" = ci ]; then
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        fi
    - name: Record prescribed starts
      if: always()
      run: |
        echo "CI: Fri 22:30 Europe/London"
        echo "DAST: N/A Europe/London"
        echo "Council: Sun 21:00 Europe/London"
