name: Weekend CI phase launcher

on:
  schedule:
    - cron: "30 22 * * 5"
    - cron: "30 21 * * 5"
    - cron: "0 21 * * 0"
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to dispatch"
        required: true
        default: ci
        type: choice
        options:
          - ci
          - council

permissions:
  actions: write
  contents: read

concurrency:
  group: weekend-phase-launcher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Europe/London phase slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase || '' }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
        shell: bash
        run: |
          set -euo pipefail
          phase=""; workflow=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
            case "$phase" in
              ci) workflow="ci.yml" ;;
              council) workflow="council.yml" ;;
              *) echo "::error::Unsupported phase $phase"; exit 1 ;;
            esac
          else
            # Resolve the immutable cron expression that fired rather than the
            # runner start minute, because GitHub scheduled jobs may start late.
            london_offset="$(TZ=Europe/London date '+%z')"
            case "${SCHEDULE_EXPR}:${london_offset}" in
              "30 21 * * 5:+0100"|"30 22 * * 5:+0000")
                phase="ci"; workflow="ci.yml" ;;
              "0 20 * * 0:+0100"|"0 21 * * 0:+0000")
                phase="council"; workflow="council.yml" ;;
            esac
          fi
          if [ -z "$phase" ]; then
            echo "Scheduled UTC/DST duplicate is outside the intended Europe/London slot; no action."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"

      - name: Dispatch phase workflow
        if: steps.slot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.slot.outputs.workflow }}
        run: gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

      - name: Record allocated windows
        if: always()
        run: |
          echo "CI: Fri 22:30–Sat 01:00"
          echo "DAST: N/A — background worker with no authorised public HTTP target"
          echo "Council: Sun 21:00–Sun 23:30"
          echo "Weekend operating envelope: Friday 20:00 to Monday 04:00 Europe/London"
