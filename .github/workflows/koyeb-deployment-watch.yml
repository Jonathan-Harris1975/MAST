name: Koyeb production deployment watch

on:
  workflow_run:
    workflows: ["MAST CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koyeb-deployment-watch-MAST
  cancel-in-progress: true

jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: Koyeb
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned release commit
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check Koyeb deployment-watch configuration
        id: deployment_config
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
        run: |
          set -euo pipefail
          missing=()
          for name in KOYEB_TOKEN KOYEB_SERVICE; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::MAST production deployment verification cannot run. Missing required configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Install verified Koyeb CLI
        run: bash scripts/install_koyeb_cli.sh
      - name: Watch production deployment
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          SERVICE_DISPLAY_NAME: MAST
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EXPECTED_DEPLOYMENT_AFTER: ${{ github.event.workflow_run.created_at || '' }}
        run: python scripts/watch_koyeb_deployment.py
      - name: Run post-deployment MAST Worker/API smoke
        run: |
          set -o pipefail
          bash scripts/run_koyeb_worker_smoke.sh | tee worker-api-smoke.log
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
          KOYEB_SERVICE: ${{ vars.KOYEB_SERVICE }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Record final exact-SHA deployment and Worker/API-smoke attestation
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","service":"MAST","status":"production-deployment-and-worker-api-smoke-green"}\n' \
            "$GITHUB_REPOSITORY" "$DEPLOYED_SHA" "$GITHUB_RUN_ID" > deployment-attestation.json
      - name: Retain post-deployment launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mast-post-deployment-smoke-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            worker-api-smoke.log
            deployment-attestation.json
          if-no-files-found: warn
          retention-days: 90


  open_dependency_revert:
    name: Open validated dependency revert PR
    needs: [watch]
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && needs.watch.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Revert only the failed dependency merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$FAILED_SHA/pulls" \
            --jq '[.[] | select(.user.login == "renovate[bot]" and .merged_at != null and .merge_commit_sha == env.FAILED_SHA and .base.ref == "main")] | first | .number // empty')"
          if [ -z "$pr_number" ]; then
            echo "Failed deployment SHA $FAILED_SHA is not a merged dependency PR; no automatic revert is created."
            exit 0
          fi

          base_ref="$(gh pr view "$pr_number" --json baseRefName --jq '.baseRefName')"
          title="$(gh pr view "$pr_number" --json title --jq '.title')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$base_ref" --prune
          git checkout -B "$base_ref" "origin/$base_ref"
          git cat-file -e "$FAILED_SHA^{commit}" 2>/dev/null || git fetch origin "$FAILED_SHA"

          branch="automation/revert-dependency-${pr_number}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          parent_count="$(git rev-list --parents -n 1 "$FAILED_SHA" | awk '{print NF-1}')"
          if [ "$parent_count" -gt 1 ]; then
            git revert -m 1 --no-edit "$FAILED_SHA"
          else
            git revert --no-edit "$FAILED_SHA"
          fi
          git push --set-upstream origin "$branch"

          printf '%s\n\n%s\n\n%s\n' \
            "This PR automatically reverts dependency PR #${pr_number} because the exact deployed SHA \`${FAILED_SHA}\` failed the production validation workflow." \
            "Original dependency PR: #${pr_number} — ${title}" \
            "The revert is deliberately opened as a PR so the repository's normal CI and required checks validate the recovery before it can merge." \
            > /tmp/revert-body.md
          gh pr create \
            --base "$base_ref" \
            --head "$branch" \
            --title "revert: dependency PR #${pr_number} after failed deployment validation" \
            --body-file /tmp/revert-body.md
